<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>__ATTO_TITLE__</title>
  <meta name="description" content="__ATTO_DESCRIPTION__" />
  <meta property="og:title" content="__ATTO_TITLE__" />
  <meta property="og:description" content="__ATTO_DESCRIPTION__" />
  <meta name="twitter:card" content="summary_large_image" />
  <script type="application/ld+json">__ATTO_SCHEMA__</script>
  <style>
    :root { color-scheme: light; --bg:#fff; --surface:#fafafa; --surface-2:#f4f4f5; --border:#e5e5e5; --text:#111; --muted:#666; --success:#15803d; --warning:#a16207; --danger:#dc2626; --info:#2563eb; --radius:14px; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    [data-theme="dark"] { color-scheme: dark; --bg:#0a0a0a; --surface:#111; --surface-2:#18181b; --border:#27272a; --text:#f5f5f5; --muted:#a1a1aa; --success:#22c55e; --warning:#eab308; --danger:#f87171; --info:#60a5fa; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size:14px; }
    a { color: inherit; text-decoration: none; } button, input, select, textarea { font: inherit; }
    header { border-bottom:1px solid var(--border); background:var(--bg); position:sticky; top:0; z-index:20; }
    .shell { width:min(1440px, calc(100% - 32px)); margin:auto; }
    .nav { height:64px; display:flex; align-items:center; justify-content:space-between; gap:20px; }
    .brand { display:flex; align-items:center; gap:10px; font-weight:700; letter-spacing:-.03em; }
    .logo { width:24px; height:24px; border:1px solid var(--border); border-radius:7px; background:var(--text); }
    nav { display:flex; gap:18px; color:var(--muted); font-size:13px; }
    .btn, button { border:1px solid var(--border); border-radius:10px; background:var(--bg); color:var(--text); padding:8px 12px; cursor:pointer; font-weight:600; }
    .btn.primary, button.primary { background:var(--text); color:var(--bg); border-color:var(--text); }
    .btn.danger, button.danger { color:var(--danger); }
    .btn:disabled, button:disabled { opacity:.45; cursor:not-allowed; }
    .hero { padding:80px 0; text-align:center; border-bottom:1px solid var(--border); }
    h1 { font-size:clamp(42px, 7vw, 84px); line-height:.95; letter-spacing:-.075em; margin:16px auto; max-width:980px; }
    h2 { font-size:28px; letter-spacing:-.04em; margin:0 0 16px; } h3 { margin:0 0 8px; letter-spacing:-.02em; }
    p { color:var(--muted); line-height:1.6; } .lead { font-size:18px; max-width:720px; margin:0 auto; }
    .eyebrow { color:var(--muted); font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.12em; }
    .app-layout { display:grid; grid-template-columns:260px 1fr; min-height:calc(100vh - 64px); }
    .sidebar { border-right:1px solid var(--border); background:var(--surface); padding:18px; position:sticky; top:64px; height:calc(100vh - 64px); overflow:auto; }
    .sidebar strong { display:block; margin:4px 0 18px; } .sidebar a { display:flex; align-items:center; justify-content:space-between; padding:9px 10px; border-radius:9px; color:var(--muted); margin:2px 0; }
    .sidebar a.active, .sidebar a:hover { background:var(--surface-2); color:var(--text); }
    .main { padding:24px; min-width:0; }
    .topline { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; margin-bottom:20px; }
    .topline h1 { font-size:32px; line-height:1.1; letter-spacing:-.045em; text-align:left; margin:4px 0 6px; }
    .grid { display:grid; gap:14px; } .metrics { grid-template-columns:repeat(4, minmax(0,1fr)); } .two { grid-template-columns:1fr 1fr; } .three { grid-template-columns:repeat(3, 1fr); }
    .card, .metric-card { border:1px solid var(--border); border-radius:var(--radius); background:var(--bg); padding:16px; }
    .metric-card span { display:block; color:var(--muted); font-size:12px; margin-bottom:10px; } .metric-card strong { font-size:26px; letter-spacing:-.04em; } .metric-card small { display:block; color:var(--muted); margin-top:8px; }
    .table-wrap { border:1px solid var(--border); border-radius:var(--radius); overflow:auto; background:var(--bg); }
    table { width:100%; border-collapse:collapse; min-width:840px; } th, td { padding:12px; border-bottom:1px solid var(--border); text-align:left; vertical-align:middle; } th { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; background:var(--surface); } tr:last-child td { border-bottom:0; }
    .status-badge, .health-badge { display:inline-flex; align-items:center; border:1px solid var(--border); border-radius:999px; padding:3px 8px; font-size:12px; font-weight:700; background:var(--surface); }
    .success { color:var(--success); } .warning { color:var(--warning); } .danger { color:var(--danger); } .info { color:var(--info); }
    .progress { height:7px; background:var(--surface-2); border-radius:999px; overflow:hidden; min-width:120px; } .progress span { display:block; height:100%; background:var(--text); }
    .actions { display:flex; gap:8px; flex-wrap:wrap; } .muted { color:var(--muted); } code, pre { font-family:var(--mono); font-size:12px; } pre { white-space:pre-wrap; max-height:360px; overflow:auto; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px; }
    .form { display:grid; gap:12px; max-width:820px; } label { display:grid; gap:6px; color:var(--muted); font-size:12px; } input, select, textarea { width:100%; border:1px solid var(--border); background:var(--bg); color:var(--text); border-radius:10px; padding:10px 12px; } textarea { min-height:140px; resize:vertical; }
    .qr { display:grid; place-items:center; min-height:220px; border:1px dashed var(--border); border-radius:14px; background:var(--surface); text-align:center; padding:16px; word-break:break-all; }
    .timeline { display:grid; gap:8px; } .event { border-left:2px solid var(--border); padding:4px 0 8px 12px; } .event strong { display:block; } .event small { color:var(--muted); }
    .empty-state, .loading-state, .error-state { border:1px dashed var(--border); border-radius:14px; padding:28px; text-align:center; color:var(--muted); }
    .danger-zone { border-color:color-mix(in srgb, var(--danger) 40%, var(--border)); }
    @media (max-width: 980px) { .app-layout { grid-template-columns:1fr; } .sidebar { position:static; height:auto; border-right:0; border-bottom:1px solid var(--border); } .metrics, .two, .three { grid-template-columns:1fr; } nav { display:none; } }
  </style>
</head>
<body data-theme="light">
  <header>
    <div class="shell nav">
      <a class="brand" href="/app/disparos"><span class="logo"></span><span>ATTO FLOW</span></a>
      <nav><a href="/app/disparos">Disparos</a><a href="/app/conexoes">Conexões</a><a href="/app/listas">Listas</a><a href="/app/templates">Templates</a><a href="/app/disparos/operacao">Operação</a></nav>
      <div class="actions"><button id="theme" type="button">Tema</button><a class="btn primary" href="/app/disparos/nova">Nova campanha</a></div>
    </div>
  </header>
  <main id="root">__ATTO_CONTENT__</main>
  <script>
    const root = document.getElementById('root');
    const state = { snapshot:null, lastEvent:null, poll:null, source:null };
    document.getElementById('theme').onclick = () => document.body.dataset.theme = document.body.dataset.theme === 'dark' ? 'light' : 'dark';
    const appLinks = [['/app/disparos','Campanhas'],['/app/disparos/nova','Nova campanha'],['/app/disparos/alertas','Alertas'],['/app/disparos/operacao','Operação'],['/app/conexoes','Conexões'],['/app/conexoes/nova','Nova conexão'],['/app/listas','Listas'],['/app/listas/nova','Nova lista'],['/app/templates','Templates']];
    const esc = (v='') => String(v ?? '').replace(/[&<>\"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    async function api(path, options={}) { const res = await fetch(path, { headers:{'content-type':'application/json','x-correlation-id': crypto.randomUUID()}, ...options }); const text = await res.text(); const data = text ? JSON.parse(text) : {}; if (!res.ok) throw new Error(data.error || res.statusText); return data; }
    function StatusBadge(status='info') { const tone = ({connected:'success',running:'success',completed:'success',sent:'success',delivered:'success',read:'success',paused:'warning',qr_required:'warning',reconnecting:'warning',pending:'warning',blocked:'danger',failed:'danger',error:'danger',disconnected:'danger'}[status]||'info'); return `<span class="status-badge ${tone}">${esc(status)}</span>`; }
    function HealthScoreBadge(score=100) { const n=Number(score||0); const tone=n<=0||n<30?'danger':n<60?'warning':n<80?'info':'success'; return `<span class="health-badge ${tone}">${n}/100</span>`; }
    function ProgressBar(done=0,total=100){ const pct=total?Math.max(0,Math.min(100,Math.round(done/total*100))):0; return `<div class="progress"><span style="width:${pct}%"></span></div><small class="muted">${pct}%</small>`; }
    function MetricCard(label,value,hint=''){ return `<article class="metric-card"><span>${esc(label)}</span><strong>${esc(value)}</strong>${hint?`<small>${esc(hint)}</small>`:''}</article>`; }
    function EmptyState(title,desc=''){ return `<div class="empty-state"><strong>${esc(title)}</strong>${desc?`<p>${esc(desc)}</p>`:''}</div>`; }
    function LoadingState(){ return `<div class="loading-state">Carregando operação…</div>`; }
    function ErrorState(err){ return `<div class="error-state danger"><strong>Erro</strong><p>${esc(err.message||err)}</p></div>`; }
    function layout(path, title, subtitle, body){ const menu=appLinks.map(([href,label])=>`<a class="${path===href?'active':''}" href="${href}">${label}<span>›</span></a>`).join(''); root.innerHTML=`<div class="app-layout"><aside class="sidebar"><strong>ATTOZAP DISPAROS</strong>${menu}</aside><section class="main"><div class="topline"><div><div class="eyebrow">${esc(path)}</div><h1>${esc(title)}</h1><p>${esc(subtitle)}</p></div><div class="actions"><button onclick="refresh()">Atualizar</button><a class="btn" href="/app/disparos/operacao">Readiness</a></div></div><div id="app-content">${body}</div></section></div>`; }
    async function loadData(){ const [overview,campaigns,connections,lists,templates,health,readiness,ops,alerts] = await Promise.all([api('/api/disparos/overview'),api('/api/disparos/campanhas'),api('/api/disparos/conexoes'),api('/api/disparos/listas'),api('/api/disparos/templates'),api('/api/disparos/health'),api('/api/disparos/readiness'),api('/api/disparos/ops-dashboard'),api('/api/disparos/alerts')]); return {overview,campaigns:campaigns.campaigns||[],connections:connections.connections||[],lists:lists.lists||[],templates:templates.templates||[],health,readiness,ops,alerts:alerts.alerts||[]}; }
    function campaignActions(c){ return `<div class="actions"><button onclick="campaignAction('${c.id}','start')">Iniciar</button><button onclick="campaignAction('${c.id}','pause')">Pausar</button><button onclick="campaignAction('${c.id}','resume')" ${c.connection?.healthScore<60?'data-confirm="Conexão degradada. Retomar mesmo assim?"':''}>Retomar</button><button class="danger" onclick="confirmAction('Cancelar campanha? Esta ação interrompe os jobs pendentes.',()=>campaignAction('${c.id}','cancel'))">Cancelar</button><button onclick="campaignAction('${c.id}','duplicate')">Duplicar</button><a class="btn" href="/app/disparos/${c.id}">Detalhes</a><a class="btn" href="/app/disparos/${c.id}/logs">Logs</a></div>`; }
    function campaignsTable(data){ if(!data.campaigns.length) return EmptyState('Nenhuma campanha','Crie uma campanha para começar a operar disparos.'); return `<div class="table-wrap"><table><thead><tr><th>Nome</th><th>Status</th><th>Progresso</th><th>Enviados</th><th>Entregues</th><th>Falhas</th><th>Conexão</th><th>Ações</th></tr></thead><tbody>${data.campaigns.map(c=>`<tr><td><strong>${esc(c.name)}</strong><br><small class="muted">${esc(c.startedAt||c.createdAt||'')}</small></td><td>${StatusBadge(c.status)}</td><td>${ProgressBar((c.totalSent||0)+(c.totalFailures||0),c.totalContacts||1)}</td><td>${c.totalSent||0}</td><td>${c.totalDelivered||0}</td><td>${c.totalFailures||0}</td><td>${esc((data.connections.find(x=>x.id===c.connectionId)||{}).name||c.connectionId)}</td><td>${campaignActions(c)}</td></tr>`).join('')}</tbody></table></div>`; }
    function dashboard(data){ const h=data.health; const metrics=[['Running',h.runningCampaigns||data.overview.running],['Pausadas',data.overview.paused||0],['Enviadas',data.overview.sent],['Entregues',h.deliveryRate?Math.round(h.deliveryRate*100)+'%':data.campaigns.reduce((s,c)=>s+(c.totalDelivered||0),0)],['Falhas',data.overview.failures],['Conectadas',data.overview.connected],['Degradadas',h.connectionsDegraded||0],['Alertas críticos',data.alerts.filter(a=>a.severity==='critical'&&a.status==='open').length]]; return `<div class="grid metrics">${metrics.map(m=>MetricCard(m[0],m[1])).join('')}</div><div class="grid two"><section><h2>Campanhas</h2>${campaignsTable(data)}</section><section>${AlertList(data.alerts)}${LiveEventTimeline()}</section></div>`; }
    function connectionCards(data){ return `<div class="grid three">${data.connections.map(c=>`<article class="card"><div class="actions" style="justify-content:space-between"><h3>${esc(c.name)}</h3>${StatusBadge(c.status)}</div><p>${esc(c.phoneNumber)} · provider ${esc(c.provider||'baileys')}</p><p>Health ${HealthScoreBadge(c.healthScore)} · ${esc(c.healthState||'healthy')}</p><p>${c.sentToday||0}/${c.dailyLimit||0} hoje · ${c.sentThisHour||0}/${c.hourlyLimit||0} hora · falhas ${c.totalFailures||0}</p><small class="muted">Heartbeat ${esc(c.lastHeartbeatAt||'-')}</small><div class="actions" style="margin-top:12px"><a class="btn" href="/app/conexoes/${c.id}">Abrir</a><button onclick="alert('Reconectar/limpar sessão exige endpoint operacional dedicado.')">Reconectar</button><button class="danger" onclick="confirmAction('Desconectar conexão?',()=>alert('Endpoint de desconexão será ligado ao gateway.'))">Desconectar</button></div></article>`).join('')}</div>`; }
    function QrCodePanel(connection){ return `<div class="qr"><div><div class="eyebrow">QR Code</div><h3>${esc(connection?.status||'pending')}</h3><code>${esc(connection?.qrCode||'QR indisponível ou sessão conectada')}</code><p>O QR atualiza via SSE e polling.</p></div></div>`; }
    function AlertList(alerts){ const open=alerts.filter(a=>a.status==='open'); return `<section class="card"><h3>Alertas</h3>${open.length?open.map(a=>`<div class="event"><strong>${StatusBadge(a.severity)} ${esc(a.title)}</strong><small>${esc(a.type)} · ${esc(a.source)} · ${esc(a.createdAt)}</small><p>${esc(a.message)}</p><button onclick="resolveAlert('${a.id}')">Resolver</button></div>`).join(''):EmptyState('Sem alertas abertos')}</section>`; }
    function ReadinessPanel(r){ const rows=['database','redis','queue','worker','gateway','baileys','sessionStorage'].map(k=>`<tr><td>${k}</td><td>${StatusBadge(r[k]?.ok?'ready':'blocked')}</td><td><code>${esc(JSON.stringify(r[k]||{}))}</code></td></tr>`).join(''); return `<div class="card"><h3>Production Ready ${StatusBadge(r.ready?'ready':'not_ready')}</h3><p>Ambiente ${esc(r.environment)} · ${esc(r.checkedAt)}</p><div class="table-wrap"><table><tbody>${rows}</tbody></table></div>${r.blockers?.length?`<pre>${esc(r.blockers.join('\n'))}</pre>`:''}</div>`; }
    function LiveEventTimeline(){ return `<section class="card"><h3>Timeline live</h3><div id="timeline" class="timeline">${state.lastEvent?eventHtml(state.lastEvent):'<div class="event"><strong>Aguardando eventos</strong><small>SSE ativo com fallback por polling de 10s</small></div>'}</div></section>`; }
    function eventHtml(e){ return `<div class="event"><strong>${esc(e.type)}</strong><small>${esc(e.timestamp||new Date().toISOString())}</small><pre>${esc(JSON.stringify(e.payload||e,null,2))}</pre></div>`; }
    async function render(path){ layout(path,'ATTOZAP DISPAROS','Operação WhatsApp limpa, técnica e em tempo real.',LoadingState()); try{ const data=await loadData(); const box=document.getElementById('app-content'); const id=(path.match(/\/app\/(?:disparos|conexoes)\/([^/]+)/)||[])[1]; if(path==='/app/disparos') box.innerHTML=dashboard(data); else if(path==='/app/disparos/nova') box.innerHTML=newCampaignForm(data); else if(path==='/app/disparos/alertas') box.innerHTML=AlertList(data.alerts); else if(path==='/app/disparos/operacao') box.innerHTML=`<div class="grid two">${ReadinessPanel(data.readiness)}<div>${AlertList(data.alerts)}<pre>${esc(JSON.stringify(data.ops,null,2))}</pre></div></div>`; else if(path.includes('/logs')) box.innerHTML=await logsPage(id); else if(path.startsWith('/app/disparos/')&&id) box.innerHTML=campaignDetail(data,id); else if(path==='/app/conexoes') box.innerHTML=connectionCards(data); else if(path==='/app/conexoes/nova') box.innerHTML=newConnectionForm(); else if(path.startsWith('/app/conexoes/')&&id) box.innerHTML=connectionDetail(data,id); else if(path==='/app/listas') box.innerHTML=listsPage(data); else if(path==='/app/listas/nova') box.innerHTML=newListForm(); else if(path==='/app/templates') box.innerHTML=templatesPage(data); else box.innerHTML=dashboard(data); connectSse(path); } catch(err){ document.getElementById('app-content').innerHTML=ErrorState(err); } }
    function campaignDetail(data,id){ const c=data.campaigns.find(x=>x.id===id); if(!c) return EmptyState('Campanha não encontrada'); const conn=data.connections.find(x=>x.id===c.connectionId)||{}; return `<div class="grid two"><section class="card"><h3>${esc(c.name)}</h3>${StatusBadge(c.status)} ${ProgressBar((c.totalSent||0)+(c.totalFailures||0),c.totalContacts||1)}<p>Enviados ${c.totalSent} · Entregues ${c.totalDelivered} · Falhas ${c.totalFailures} · Pendentes ${c.totalPending}</p><p>Pause reason: ${esc(c.pauseReason||'-')}</p>${campaignActions(c)}</section><section class="card"><h3>Conexão</h3><p>${esc(conn.name)} ${StatusBadge(conn.status)}</p><p>${HealthScoreBadge(conn.healthScore)} ${esc(conn.healthState||'')}</p></section></div><div class="grid two"><section class="card"><h3>Jobs</h3><pre>${esc(JSON.stringify(c.jobs||[],null,2))}</pre></section>${LiveEventTimeline()}</div>`; }
    async function logsPage(id){ const logs=await api(`/api/disparos/campanhas/${id}/logs`); return `<div class="card"><h3>Filtros</h3><div class="grid three"><input placeholder="status" oninput="filterLogs()"><input placeholder="tipo"><input placeholder="correlationId"></div></div><div class="table-wrap"><table><thead><tr><th>Horário</th><th>Tipo</th><th>Status</th><th>Correlation</th><th>Erro</th><th>Metadata</th></tr></thead><tbody>${(logs.logs||[]).map(l=>`<tr><td>${esc(l.createdAt)}</td><td>${esc(l.type)}</td><td>${StatusBadge(l.status)}</td><td><code>${esc(l.metadata?.correlationId||'-')}</code></td><td>${esc(l.error||'')}</td><td><pre>${esc(JSON.stringify(l.metadata||{}))}</pre></td></tr>`).join('')}</tbody></table></div>`; }
    function connectionDetail(data,id){ const c=data.connections.find(x=>x.id===id); if(!c) return EmptyState('Conexão não encontrada'); return `<div class="grid two"><section class="card"><h3>${esc(c.name)}</h3>${StatusBadge(c.status)} ${HealthScoreBadge(c.healthScore)}<p>${esc(c.phoneNumber)} · ${esc(c.sessionPath||'')}</p><p>Enviadas hoje ${c.sentToday||0}; falhas ${c.totalFailures||0}; heartbeat ${esc(c.lastHeartbeatAt||'-')}</p><div class="actions"><button>Editar limites</button><button class="danger" onclick="confirmAction('Limpar sessão? Faça backup antes.',()=>alert('Endpoint pendente.'))">Limpar sessão</button></div></section>${QrCodePanel(c)}</div><pre>${esc(JSON.stringify(c,null,2))}</pre>`; }
    function listsPage(data){ return `<div class="grid three">${data.lists.map(l=>`<article class="card"><h3>${esc(l.name)}</h3><p>${l.totalContacts} contatos · ${l.validContacts} válidos · ${l.invalidContacts} inválidos · ${l.duplicateContacts} duplicados</p><small>${esc(l.source)}</small><div class="actions"><button>Duplicar</button><button class="danger" onclick="confirmAction('Excluir lista?',()=>alert('Endpoint pendente.'))">Excluir</button></div></article>`).join('')}</div>`; }
    function templatesPage(data){ return `<div class="grid two"><form class="card form" onsubmit="createTemplate(event)"><h3>Novo template</h3><label>Nome<input name="name" required></label><label>Mensagem<textarea name="body" required>Olá {{nome}}, {tudo bem?|como vai?}</textarea></label><button class="primary">Criar</button></form><section class="grid">${data.templates.map(t=>`<article class="card"><h3>${esc(t.name)}</h3><p>${esc(t.body)}</p><small>${esc((t.variables||[]).join(', '))}</small><div class="actions"><button>Preview</button><button>Duplicar</button></div></article>`).join('')}</section></div>`; }
    function newCampaignForm(data){ return `<form class="card form" onsubmit="createCampaign(event)"><h3>Nova campanha</h3><label>Nome<input name="name" required></label><label>Conexão<select name="connectionId" required>${data.connections.map(c=>`<option value="${c.id}" ${c.status==='blocked'?'disabled':''}>${esc(c.name)} · ${c.status} · health ${c.healthScore||100}</option>`).join('')}</select></label><label>Lista<select name="contactListId" required>${data.lists.map(l=>`<option value="${l.id}">${esc(l.name)} · ${l.validContacts} válidos</option>`).join('')}</select></label><label>Template<select onchange="document.querySelector('[name=message]').value=this.selectedOptions[0].dataset.body||''"><option data-body="">Sem template</option>${data.templates.map(t=>`<option data-body="${esc(t.body)}">${esc(t.name)}</option>`).join('')}</select></label><label>Mensagem<textarea name="message" required>Olá {{nome}}, tudo bem?</textarea></label><label>Mídia opcional<input name="mediaUrl"></label><div class="grid two"><label>Delay mínimo<input name="delayMinMs" type="number" value="12000"></label><label>Delay máximo<input name="delayMaxMs" type="number" value="45000"></label></div><button class="primary">Criar campanha</button></form><section class="card"><h3>Preview</h3><button onclick="previewMessage()">Renderizar preview</button><pre id="preview"></pre></section>`; }
    function newConnectionForm(){ return `<form class="card form" onsubmit="createConnection(event)"><h3>Nova conexão</h3><label>Nome<input name="name" required></label><label>Número<input name="phoneNumber" placeholder="11999999999" required></label><div class="grid two"><label>Limite diário<input name="dailyLimit" type="number" value="500"></label><label>Limite horário<input name="hourlyLimit" type="number" value="60"></label></div><div class="grid two"><label>Delay mínimo<input name="delayMinMs" type="number" value="12000"></label><label>Delay máximo<input name="delayMaxMs" type="number" value="45000"></label></div><button class="primary">Criar e gerar QR</button></form><div id="new-qr">${QrCodePanel({status:'pending'})}</div>`; }
    function newListForm(){ return `<form class="card form" onsubmit="createList(event)"><h3>Nova lista</h3><label>Nome<input name="name" required></label><label>Origem<select name="source"><option>manual</option><option>csv</option><option>xlsx</option></select></label><label>Colar contatos<textarea name="raw" placeholder="Nome;(11) 99999-9999;tag"></textarea></label><button class="primary">Importar lista</button></form>`; }
    async function createCampaign(e){ e.preventDefault(); const body=Object.fromEntries(new FormData(e.target)); await api('/api/disparos/campanhas',{method:'POST',body:JSON.stringify(body)}); location.href='/app/disparos'; }
    async function createConnection(e){ e.preventDefault(); const body=Object.fromEntries(new FormData(e.target)); const data=await api('/api/disparos/conexoes',{method:'POST',body:JSON.stringify(body)}); document.getElementById('new-qr').innerHTML=QrCodePanel(data.connection); }
    async function createList(e){ e.preventDefault(); const body=Object.fromEntries(new FormData(e.target)); await api('/api/disparos/listas',{method:'POST',body:JSON.stringify(body)}); location.href='/app/listas'; }
    async function createTemplate(e){ e.preventDefault(); const body=Object.fromEntries(new FormData(e.target)); await api('/api/disparos/templates',{method:'POST',body:JSON.stringify(body)}); refresh(); }
    async function previewMessage(){ const msg=document.querySelector('[name=message]')?.value||''; const r=await api('/api/disparos/preview',{method:'POST',body:JSON.stringify({message:msg,name:'Maria Silva',phone:'5511999999999'})}); document.getElementById('preview').textContent=r.rendered; }
    function confirmAction(message, fn){ if(confirm(message)) fn(); }
    async function campaignAction(id,action){ try{ await api(`/api/disparos/campanhas/${id}/${action}`,{method:'POST',body:'{}'}); refresh(); }catch(e){ alert(e.message); } }
    async function resolveAlert(id){ await api(`/api/disparos/alerts/${id}/resolve`,{method:'POST',body:'{}'}); refresh(); }
    function connectSse(path){ if(state.source) state.source.close(); if(!path.startsWith('/app')) return; try{ state.source=new EventSource('/api/disparos/events'); const onEvent=e=>{ state.lastEvent=JSON.parse(e.data); const t=document.getElementById('timeline'); if(t) t.insertAdjacentHTML('afterbegin',eventHtml(state.lastEvent)); }; ['qr.generated','connection.status_changed','connection.blocked','connection.degraded','campaign.progress','campaign.completed','campaign.paused','campaign.resumed','campaign.canceled','message.sent','message.delivered','message.read','message.replied','message.failed','message.retrying','gateway.status','gateway.qr','snapshot','heartbeat','reconciliation.completed'].forEach(type=>state.source.addEventListener(type,onEvent)); }catch(_){} clearInterval(state.poll); state.poll=setInterval(()=>render(location.pathname),10000); }
    function refresh(){ render(location.pathname); }
    function landing(){ root.innerHTML=`<section class="hero shell"><div class="eyebrow">ATTO FLOW</div><h1>Operação comercial com WhatsApp, CRM e automação.</h1><p class="lead">Interface corporativa para acompanhar campanhas, conexões, listas, templates, alertas e readiness.</p><div style="margin-top:24px"><a class="btn primary" href="/app/disparos">Abrir operação</a></div></section>`; }
    function generic(path){ root.innerHTML=`<section class="hero shell"><div class="eyebrow">ATTO FLOW</div><h1>${esc(path.replace(/^\//,''))}</h1><p class="lead">Página disponível na plataforma ATTO FLOW.</p><a class="btn" href="/app/disparos">Voltar para operação</a></section>`; }
    const route = window.__ATTO_ROUTE__ === '__ATTO_ROUTE__' ? location.pathname : window.__ATTO_ROUTE__;
    if(route.startsWith('/app')) render(route); else if(route === '/') landing(); else generic(route);
  </script>
</body>
</html>
