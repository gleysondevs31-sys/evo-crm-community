<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>__ATTO_TITLE__</title>
  <meta name="description" content="__ATTO_DESCRIPTION__" />
  <meta property="og:title" content="__ATTO_TITLE__" />
  <meta property="og:description" content="__ATTO_DESCRIPTION__" />
  <meta name="twitter:card" content="summary_large_image" />
  <script type="application/ld+json">__ATTO_SCHEMA__</script>
  <style>
    :root { color-scheme: light dark; --bg: #ffffff; --text: #050505; --muted: #666; --panel: rgba(255,255,255,.76); --line: rgba(0,0,0,.09); --soft: #f6f6f7; --purple: #7c3aed; --blue: #0284c7; --green: #059669; --shadow: 0 24px 80px rgba(15,23,42,.08); }
    [data-theme="dark"] { --bg: #05050a; --text: #fafafa; --muted: #a6a6b8; --panel: rgba(18,18,28,.78); --line: rgba(255,255,255,.12); --soft: #0d0d14; --purple: #8b5cf6; --blue: #22d3ee; --green: #34d399; --shadow: 0 24px 90px rgba(0,0,0,.38); }
    * { box-sizing: border-box; }
    body { margin: 0; background: radial-gradient(circle at 20% -10%, color-mix(in srgb, var(--purple) 20%, transparent), transparent 30rem), radial-gradient(circle at 90% 10%, color-mix(in srgb, var(--blue) 16%, transparent), transparent 30rem), var(--bg); color: var(--text); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    a { color: inherit; text-decoration: none; }
    .shell { width: min(1180px, calc(100% - 32px)); margin: auto; }
    header { position: sticky; top: 0; z-index: 10; backdrop-filter: blur(18px); border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--bg) 82%, transparent); }
    .nav { height: 70px; display: flex; align-items: center; justify-content: space-between; gap: 18px; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 900; letter-spacing: -.04em; }
    .logo { width: 30px; height: 30px; border-radius: 10px; background: linear-gradient(135deg, var(--purple), var(--blue)); box-shadow: 0 0 30px color-mix(in srgb, var(--purple) 50%, transparent); }
    nav { display: flex; gap: 18px; color: var(--muted); font-size: 14px; }
    .actions { display: flex; gap: 10px; align-items: center; }
    button, .btn { border: 1px solid var(--line); border-radius: 999px; background: var(--panel); color: var(--text); padding: 10px 14px; font-weight: 800; cursor: pointer; }
    .btn.primary { border: 0; color: white; background: linear-gradient(90deg, var(--purple), var(--blue)); }
    .hero { padding: clamp(64px, 10vw, 132px) 0 64px; text-align: center; }
    .eyebrow { color: var(--green); font-size: 12px; font-weight: 900; letter-spacing: .18em; text-transform: uppercase; }
    h1 { font-size: clamp(48px, 9vw, 104px); line-height: .9; letter-spacing: -.08em; margin: 18px auto; max-width: 990px; }
    h2 { font-size: clamp(30px, 4vw, 54px); line-height: 1; letter-spacing: -.05em; margin: 0 0 16px; }
    h3 { margin: 0 0 8px; letter-spacing: -.03em; }
    p { color: var(--muted); line-height: 1.65; }
    .lead { font-size: clamp(18px, 2vw, 23px); max-width: 780px; margin: 0 auto; }
    .gradient { background: linear-gradient(90deg, var(--purple), var(--blue)); -webkit-background-clip: text; color: transparent; }
    .hero-actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
    .panel { border: 1px solid var(--line); border-radius: 28px; background: var(--panel); box-shadow: var(--shadow); backdrop-filter: blur(14px); }
    .product-shot { margin: 38px auto 0; text-align: left; padding: 14px; max-width: 1040px; }
    .bar { display: flex; gap: 8px; padding: 10px; border-bottom: 1px solid var(--line); }
    .dot { width: 11px; height: 11px; border-radius: 999px; background: var(--line); }
    .shot-grid { display: grid; grid-template-columns: 1fr 1.3fr; gap: 14px; padding: 14px; }
    .sidebar, .screen { border: 1px solid var(--line); border-radius: 20px; background: color-mix(in srgb, var(--soft) 70%, transparent); padding: 18px; }
    .metric-grid, .feature-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin: 26px 0; }
    .card { border: 1px solid var(--line); border-radius: 24px; background: var(--panel); padding: 22px; box-shadow: var(--shadow); }
    section { padding: 42px 0; }
    .compare { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
    .app-layout { display: grid; grid-template-columns: 260px 1fr; gap: 18px; padding: 24px 0; }
    .app-menu { position: sticky; top: 88px; align-self: start; }
    .app-menu a { display: block; padding: 10px 12px; color: var(--muted); border-radius: 12px; }
    .app-menu a:hover { background: var(--soft); color: var(--text); }
    .kanban { display: grid; grid-template-columns: repeat(4, minmax(220px, 1fr)); gap: 14px; overflow-x: auto; }
    .lead-card { border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin: 10px 0; background: color-mix(in srgb, var(--soft) 70%, transparent); }
    .hidden { display: none; }
    footer { border-top: 1px solid var(--line); margin-top: 44px; padding: 28px 0; color: var(--muted); }
    @media (max-width: 820px) { nav { display:none; } .shot-grid, .app-layout { grid-template-columns: 1fr; } h1 { letter-spacing: -.05em; } }
  </style>
</head>
<body data-theme="dark">
  <header>
    <div class="shell nav">
      <a class="brand" href="/"><span class="logo"></span><span>ATTO FLOW</span></a>
      <nav><a href="/crm">CRM</a><a href="/whatsapp">WhatsApp</a><a href="/automacao">Automação</a><a href="/ia">IA</a><a href="/precos">Preços</a></nav>
      <div class="actions"><button id="theme">Tema</button><a class="btn" href="/login">Login</a><a class="btn primary" href="/demo">Agendar demo</a></div>
    </div>
  </header>
  <main id="root" class="shell">__ATTO_CONTENT__</main>
  <footer><div class="shell">ATTO FLOW © 2026 · CRM, WhatsApp, automação e IA para empresas brasileiras.</div></footer>
  <script>
    window.__ATTO_ROUTE__ = '__ATTO_ROUTE__';
    const publicRoutes = new Set(['/', '/precos', '/recursos', '/crm', '/whatsapp', '/automacao', '/ia', '/relatorios', '/integracoes', '/seguranca', '/clientes', '/casos-de-uso', '/imobiliarias', '/vendas', '/atendimento', '/blog', '/docs', '/docs/api', '/changelog', '/status', '/sobre', '/contato', '/login', '/cadastro', '/demo', '/politica-de-privacidade', '/termos-de-uso', '/cookies', '/lgpd']);
    const appLinks = ['/app/disparos','/app/disparos/nova','/app/conexoes','/app/conexoes/nova','/app/listas','/app/listas/nova','/app/templates','/app/dashboard','/app/admin/system-health'];
    const root = document.getElementById('root');
    document.getElementById('theme').onclick = () => document.body.dataset.theme = document.body.dataset.theme === 'dark' ? 'light' : 'dark';

    async function api(path, options) {
      const res = await fetch(path, { headers: { 'content-type': 'application/json' }, ...options });
      return res.json();
    }

    function landing() {
      root.innerHTML = `
        <section class="hero">
          <div class="eyebrow">SaaS enterprise para operação comercial</div>
          <h1>Venda, atenda e automatize com <span class="gradient">ATTO FLOW</span>.</h1>
          <p class="lead">Substitua planilhas, WhatsApp bagunçado e processos manuais por CRM, multiatendimento, campanhas, automação, relatórios, gamificação e ATTO AI em uma única plataforma.</p>
          <div class="hero-actions"><a class="btn primary" href="/demo">Agendar demonstração</a><a class="btn" href="/app/dashboard">Ver produto</a></div>
          <div class="panel product-shot"><div class="bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div><div class="shot-grid"><div class="sidebar"><strong>Inbox compartilhada</strong><p>WhatsApp, CRM e automações por equipe.</p><div id="mini-inbox"></div></div><div class="screen"><strong>Dashboard operacional</strong><div id="mini-metrics" class="metric-grid"></div></div></div></div>
        </section>
        <section><h2>Módulos para operar de ponta a ponta</h2><div class="feature-grid" id="features"></div></section>
        <section class="compare"><div class="card"><h3>Sem planilhas</h3><p>Pipeline, histórico, tarefas e relatórios centralizados.</p></div><div class="card"><h3>Sem WhatsApp perdido</h3><p>Conexões, inbox, campanhas, filas e atendimento por equipe.</p></div><div class="card"><h3>Com IA interna</h3><p>Resumos, classificação, sugestões, RAG e análise de performance.</p></div></section>
        <section><h2>FAQ</h2><div class="feature-grid"><div class="card"><h3>É só CRM?</h3><p>Não. CRM é um módulo dentro da ATTO FLOW, junto com ATTOZAP, automações, relatórios, gamificação e ATTO AI.</p></div><div class="card"><h3>Funciona com WhatsApp?</h3><p>A arquitetura prevê Baileys, múltiplos números, filas, QR Code, reconexão e webhooks.</p></div><div class="card"><h3>É multiempresa?</h3><p>Sim. Todo dado sensível usa contexto de empresa e RBAC.</p></div></div></section>`;
      hydrateLanding();
    }

    async function hydrateLanding() {
      const [dashboard, inbox, plans] = await Promise.all([api('/api/dashboard'), api('/api/attozap/inbox'), api('/api/billing/plans')]);
      document.getElementById('mini-metrics').innerHTML = [['Leads', dashboard.totalLeads], ['Conversas', dashboard.activeConversations], ['Conexões', dashboard.connectionsOnline], ['Campanhas', dashboard.campaigns]].map(([k,v]) => `<div class="card"><div class="eyebrow">${k}</div><h3>${v}</h3></div>`).join('');
      document.getElementById('mini-inbox').innerHTML = inbox.conversations.map((c) => `<div class="lead-card"><strong>${c.leadName}</strong><p>${c.preview}</p></div>`).join('');
      document.getElementById('features').innerHTML = ['ATTOZAP','CRM','AUTOMAÇÃO','ATTO AI','RELATÓRIOS','GAMIFICAÇÃO','OMNICHANNEL','ADMIN ENTERPRISE'].map((name, i) => `<div class="card"><div class="eyebrow">0${i+1}</div><h3>${name}</h3><p>${plans.plans[i % plans.plans.length].name} ready · modular · escalável.</p></div>`).join('');
    }

    function appPage(path) {
      root.innerHTML = `<div class="app-layout"><aside class="panel app-menu"><strong>ATTOZAP DISPAROS</strong>${appLinks.map((href) => `<a href="${href}">${href.replace('/app/','').replaceAll('/',' · ')}</a>`).join('')}</aside><section><div class="card"><div class="eyebrow">${path}</div><h1 style="font-size:54px">${path === '/app' ? 'Dashboard' : path.split('/').filter(Boolean).slice(1).join(' · ')}</h1><p>Operação focada em disparos WhatsApp: campanhas, conexões, listas, templates, filas, limites, logs e tempo real.</p></div><div id="app-content" style="margin-top:18px"></div></section></div>`;
      hydrateApp(path);
    }

    async function hydrateApp(path) {
      const box = document.getElementById('app-content');
      const [overview, campaigns, connections, lists, templates, health] = await Promise.all([api('/api/disparos/overview'), api('/api/disparos/campanhas'), api('/api/disparos/conexoes'), api('/api/disparos/listas'), api('/api/disparos/templates'), api('/api/admin/system-health')]);
      if (path.includes('disparos')) {
        box.innerHTML = `<div class="metric-grid">${[['Campanhas',overview.campaigns],['Rodando',overview.running],['Enviadas',overview.sent],['Falhas',overview.failures]].map(([k,v]) => `<div class="card"><div class="eyebrow">${k}</div><h2>${v}</h2></div>`).join('')}</div><div class="feature-grid">${campaigns.campaigns.map(c => `<div class="card"><div class="eyebrow">${c.status}</div><h3>${c.name}</h3><p>${c.totalSent} enviados · ${c.totalFailures} falhas · ${c.totalPending} pendentes</p><div class="hero-actions"><button onclick="campaignAction('${c.id}','start')">Iniciar</button><button onclick="campaignAction('${c.id}','pause')">Pausar</button><button onclick="campaignAction('${c.id}','resume')">Retomar</button><button onclick="campaignAction('${c.id}','cancel')">Cancelar</button></div><a href="/app/disparos/${c.id}/logs">Ver logs</a></div>`).join('')}</div>`;
      } else if (path.includes('conexoes')) {
        box.innerHTML = `<div class="feature-grid">${connections.connections.map(c => `<div class="card"><div class="eyebrow">${c.status}</div><h3>${c.name}</h3><p>${c.phoneNumber} · ${c.messagesSent} enviadas · ${c.totalFailures} falhas</p><p>Limites: ${c.hourlyLimit}/hora · ${c.dailyLimit}/dia</p><code>${c.qrCode || 'conectado'}</code></div>`).join('')}</div>`;
      } else if (path.includes('listas')) {
        box.innerHTML = `<div class="feature-grid">${lists.lists.map(l => `<div class="card"><h3>${l.name}</h3><p>${l.validContacts} válidos · ${l.invalidContacts} inválidos · ${l.duplicateContacts} duplicados</p><p>${l.source}</p></div>`).join('')}</div>`;
      } else if (path.includes('templates')) {
        box.innerHTML = `<div class="feature-grid">${templates.templates.map(t => `<div class="card"><h3>${t.name}</h3><p>${t.body}</p><div class="eyebrow">${t.variables.join(', ')}</div></div>`).join('')}</div>`;
      } else {
        box.innerHTML = `<div class="metric-grid">${[['Campanhas',overview.campaigns],['Conectadas',overview.connected],['Fila',health.queueDepth],['Falhas',overview.failures]].map(([k,v]) => `<div class="card"><div class="eyebrow">${k}</div><h2>${v}</h2></div>`).join('')}</div><div class="card"><h3>ATTOZAP DISPAROS</h3><p>Painel administrativo para controlar conexões, listas, templates, campanhas, filas, pausas, retomadas, cancelamentos e logs.</p></div>`;
      }
    }

    async function campaignAction(campaignId, action) { const data = await api(`/api/disparos/campanhas/${campaignId}/${action}`, { method: 'POST', body: '{}' }); if (data.error) alert(data.error); appPage(location.pathname); }
    async function suggest(leadId) { const data = await api(`/api/attozap/leads/${leadId}/suggest-reply`); alert(data.suggestion || 'Sem sugestão'); appPage(location.pathname); }
    function generic(path) { root.innerHTML = `<section class="hero"><div class="eyebrow">ATTO FLOW</div><h1>${path === '/404' ? 'Página não encontrada' : path.replace(/^\//,'').replaceAll('/',' · ').replaceAll('-',' ')}</h1><p class="lead">Página estruturada com SEO, CTA, conteúdo e links internos para a plataforma enterprise.</p><div class="hero-actions"><a class="btn primary" href="/demo">Agendar demo</a><a class="btn" href="/">Voltar</a></div></section>`; }
    const route = window.__ATTO_ROUTE__ === '__ATTO_ROUTE__' ? location.pathname : window.__ATTO_ROUTE__;
    if (route.startsWith('/app')) appPage(route); else if (route === '/') landing(); else generic(route);
  </script>
</body>
</html>
